version: '3'
services:
  admin-system:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      # 避免覆盖容器内的 node_modules
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # 在某些文件系统上需要此选项以支持热重载
